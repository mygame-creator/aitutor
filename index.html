<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Socratic Tutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0d0f12;
            --bg-card: #171a24;
            --accent-gold: #ffb703;
            --text-main: #f8f9fa;
            --text-muted: #8d99ae;
            --border-color: #2b2d42;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR STYLES */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        #sidebar.collapsed {
            transform: translateX(-100%);
            position: absolute;
            height: 100%;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-menu { padding: 20px; flex: 1; }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 8px;
        }
        .menu-item:hover, .menu-item.active { background: rgba(255, 183, 3, 0.1); color: var(--accent-gold); }

        /* MAIN CONTENT AREA */
        #main-wrapper { flex: 1; display: flex; flex-direction: column; height: 100vh; position: relative; }

        header {
            height: 65px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg-card);
        }

        .header-left { display: flex; align-items: center; gap: 16px; }
        .toggle-btn { background: none; border: none; color: var(--text-main); font-size: 20px; cursor: pointer; }
        .logo { font-weight: 800; font-size: 20px; letter-spacing: 1px; color: #fff; }
        .logo span { color: var(--accent-gold); }

        .auth-btn {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* CHAT WORKSPACE */
        .chat-container { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 24px; max-width: 900px; margin: 0 auto; width: 100%; }
        .chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 8px; }

        .msg { max-width: 80%; padding: 14px 18px; border-radius: 10px; font-size: 15px; line-height: 1.5; }
        .msg.user { align-self: flex-end; background: var(--accent-gold); color: #000; font-weight: 600; }
        .msg.bot { align-self: flex-start; background: #171a24; color: var(--text-main); border: 1px solid var(--border-color); }

        .input-wrapper { display: flex; gap: 12px; margin-top: 18px; }
        .input-wrapper input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 16px;
            border-radius: 8px;
            outline: none;
        }
        .input-wrapper button {
            background: var(--accent-gold);
            color: #000;
            border: none;
            padding: 0 28px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        .auth-card { background: var(--bg-card); padding: 32px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .auth-card input { padding: 12px; background: var(--bg-dark); border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-graduation-cap"></i> Menu</h3>
            <button class="toggle-btn" id="closeSidebarBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item active"><i class="fa-solid fa-message"></i> Chat</div>
            <div class="menu-item"><i class="fa-solid fa-book"></i> Notes</div>
            <div class="menu-item"><i class="fa-solid fa-gear"></i> Settings</div>
        </div>
    </aside>

    <div id="main-wrapper">
        <header>
            <div class="header-left">
                <button class="toggle-btn" id="openSidebarBtn"><i class="fa-solid fa-bars"></i></button>
                <div class="logo">AI<span>.TUTOR</span></div>
            </div>
            <div id="userSection">
                <button class="auth-btn" id="loginModalBtn" onclick="openAuthModal()">LOGIN / REGISTER</button>
            </div>
        </header>

        <main class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="msg bot">Welcome to your AI Socratic Study Tutor! Share what you are studying or stuck on.</div>
            </div>
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMessage()" />
                <button onclick="sendMessage()">SEND</button>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="auth-card">
            <h3>ACCOUNT ACCESS</h3>
            <input type="email" id="authEmail" placeholder="Email Address" />
            <input type="password" id="authPassword" placeholder="Password" />
            <button class="auth-btn" onclick="loginWithEmail()">Login / Register</button>
            <button class="auth-btn" style="background:#fff; color:#000" onclick="loginWithGoogle()"><i class="fa-brands fa-google"></i> Google Sign In</button>
            <button style="background:transparent; color:var(--text-muted); border:none; cursor:pointer;" onclick="closeAuthModal()">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AiZaSyCF0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
            authDomain: "mygamescratch.firebaseapp.com",
            projectId: "mygamescratch",
            storageBucket: "mygamescratch.firebasestorage.app",
            messagingSenderId: "256549154945",
            appId: "1:256549154945:web:8263715cc4526bcdf65d80"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        // RELATIVE BACKEND ENDPOINT
        const BACKEND_URL = "/api/chat";

        // SIDEBAR TOGGLE LOGIC
        const sidebar = document.getElementById("sidebar");
        document.getElementById("openSidebarBtn").addEventListener("click", () => sidebar.classList.remove("collapsed"));
        document.getElementById("closeSidebarBtn").addEventListener("click", () => sidebar.classList.add("collapsed"));

        // CHAT LOGIC
        window.sendMessage = async function() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, "user");
            input.value = "";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                appendMessage(data.reply || data.error || "No response received.", "bot");
            } catch (err) {
                appendMessage("Error connecting to server. Please try again.", "bot");
            }
        };

        function appendMessage(text, sender) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = `msg ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // AUTH MODAL LOGIC
        window.openAuthModal = () => document.getElementById("authModal").style.display = "flex";
        window.closeAuthModal = () => document.getElementById("authModal").style.display = "none";

        window.loginWithEmail = async () => {
            const email = document.getElementById("authEmail").value;
            const pass = document.getElementById("authPassword").value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                closeAuthModal();
            } catch (err) {
                try {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    closeAuthModal();
                } catch (e) { alert(e.message); }
            }
        };

        window.loginWithGoogle = async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                closeAuthModal();
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, (user) => {
            const userSec = document.getElementById("userSection");
            if (user) {
                userSec.innerHTML = `<button class="auth-btn" style="background:#2b2d42; color:#fff;" onclick="logout()">Logout (${user.email.split('@')[0]})</button>`;
            } else {
                userSec.innerHTML = `<button class="auth-btn" onclick="openAuthModal()">LOGIN / REGISTER</button>`;
            }
        });

        window.logout = () => signOut(auth);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mygame - AI Socratic Tutor</title>
  
  <!-- Font Awesome Icons & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-dark: #08090c;
      --bg-card: #111319;
      --accent-gold: #ffb703;
      --accent-cyan: #00f0ff;
      --accent-hover: #ffd166;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: #1e222d;
      --border-active: #ffb703;
      --sidebar-width: 65px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* SIDEBAR WITH GLOW EFFECTS */
    aside {
      width: var(--sidebar-width);
      background: #050608;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      gap: 22px;
      z-index: 10;
    }

    .sidebar-icon {
      color: var(--text-muted);
      font-size: 19px;
      cursor: pointer;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      transition: all 0.25s ease;
    }
    .sidebar-icon:hover, .sidebar-icon.active { 
      background: rgba(255, 183, 3, 0.12); 
      color: var(--accent-gold); 
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.3);
      border: 1px solid rgba(255, 183, 3, 0.3);
    }

    /* MAIN WRAPPER */
    .main-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* HEADER */
    header {
      height: 70px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
    }

    .brand-logo { font-size: 24px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    .brand-logo span { color: var(--accent-gold); text-shadow: 0 0 10px rgba(255, 183, 3, 0.4); }

    .nav-links { display: flex; align-items: center; gap: 18px; }
    
    /* LOGIN BUTTON & ACCOUNT SWITCHER */
    .btn-login {
      background: linear-gradient(135deg, var(--accent-gold), #e09f00);
      color: #000;
      font-weight: 700;
      padding: 9px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(255, 183, 3, 0.2);
    }
    .btn-login:hover {
      box-shadow: 0 0 18px rgba(255, 183, 3, 0.5);
      transform: translateY(-1px);
    }

    .account-switcher { position: relative; }
    .account-btn {
      background: #161922;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 15px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      transition: border 0.2s;
    }
    .account-btn:hover { border-color: var(--accent-gold); }
    
    .account-dropdown {
      position: absolute;
      right: 0;
      top: 50px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 200px;
      display: none;
      flex-direction: column;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      z-index: 100;
    }
    .account-dropdown div {
      padding: 12px 16px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.2s;
    }
    .account-dropdown div:hover { background: #1a1e2b; color: var(--accent-gold); }
    .account-switcher.active .account-dropdown { display: flex; }

    /* AUTH MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }
    .auth-card h3 { color: var(--accent-gold); text-align: center; font-weight: 800; font-size: 20px; }
    .auth-card input {
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px 14px;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }
    .auth-card input:focus { border-color: var(--accent-gold); box-shadow: 0 0 8px rgba(255, 183, 3, 0.3); }
    .auth-btn {
      background: var(--accent-gold);
      color: #000;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-btn:hover { background: var(--accent-hover); }
    .google-btn {
      background: #4285F4;
      color: #fff;
      font-weight: 600;
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* CHAT WORKSPACE */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 950px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
    }
    .chat-box {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .msg { max-width: 75%; padding: 14px 18px; border-radius: 10px; font-size: 14px; line-height: 1.6; }
    .msg.user { align-self: flex-end; background: var(--accent-gold); color: #000; font-weight: 600; }
    .msg.bot { align-self: flex-start; background: #171a24; color: var(--text-main); border: 1px solid var(--border-color); }

    .input-wrapper { display: flex; gap: 12px; margin-top: 18px; }
    .input-wrapper input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 16px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      transition: border 0.2s;
    }
    .input-wrapper input:focus { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(255, 183, 3, 0.2); }
    .input-wrapper button {
      background: var(--accent-gold);
      color: #000;
      border: none;
      padding: 0 28px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .input-wrapper button:hover { background: var(--accent-hover); box-shadow: 0 0 12px rgba(255, 183, 3, 0.4); }
  </style>
</head>
<body>

  <!-- GAMING SIDEBAR WITH GLOW EFFECTS -->
  <aside>
    <div class="sidebar-icon active"><i class="fa-solid fa-house"></i></div>
    <div class="sidebar-icon"><i class="fa-solid fa-gamepad"></i></div>
    <div class="sidebar-icon"><i class="fa-solid fa-graduation-cap"></i></div>
    <div class="sidebar-icon"><i class="fa-solid fa-gear"></i></div>
  </aside>

  <div class="main-wrapper">
    <!-- HEADER -->
    <header>
      <div class="brand-logo">M<span>y</span>g<span>a</span>m<span>e</span></div>

      <div class="nav-links">
        <!-- DIRECT LOGIN BUTTON -->
        <button class="btn-login" id="loginHeaderBtn" onclick="openAuthModal()">LOGIN / REGISTER</button>

        <!-- ACCOUNT SWITCHER DROPDOWN -->
        <div class="account-switcher" id="accSwitcher" onclick="toggleAccountMenu()">
          <div class="account-btn">
            <i class="fa-solid fa-user"></i>
            <span id="currentAccount">Guest User</span>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <div class="account-dropdown">
            <div id="logoutBtn" style="display:none;" onclick="logoutUser()">Log Out</div>
          </div>
        </div>
      </div>
    </header>

    <!-- CHAT WORKSPACE -->
    <div class="chat-container">
      <div class="chat-box" id="chatBox">
        <div class="msg bot">Welcome to Mygame Socratic AI Tutor! Click Login above to authenticate using Email or Gmail.</div>
      </div>

      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMessage()" />
        <button onclick="sendMessage()">SEND</button>
      </div>
    </div>
  </div>

  <!-- AUTHENTICATION MODAL -->
  <div class="modal-overlay" id="authModal">
    <div class="auth-card">
      <h3>ACCOUNT LOGIN</h3>
      <input type="email" id="authEmail" placeholder="Email Address" />
      <input type="password" id="authPassword" placeholder="Password" />
      <button class="auth-btn" onclick="loginWithEmail()">Login / Register</button>
      <button class="google-btn" onclick="loginWithGoogle()"><i class="fa-brands fa-google"></i> Sign in with Gmail</button>
      <button style="background:transparent; color:var(--text-muted); border:none; cursor:pointer;" onclick="closeAuthModal()">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCf0Pfa0HOV4ciAVtqwLVNq_gLcCtAAk8Q",
      authDomain: "mygamescratch.firebaseapp.com",
      projectId: "mygamescratch",
      storageBucket: "mygamescratch.firebasestorage.app",
      messagingSenderId: "256549154945",
      appId: "1:256549154945:web:8263715cc4526bcdf65d80"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    const BACKEND_URL = "YOUR_DEPLOYED_PYTHON_URL";

    // Track User Authentication State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("currentAccount").innerText = user.displayName || user.email;
        document.getElementById("loginHeaderBtn").style.display = "none";
        document.getElementById("logoutBtn").style.display = "block";
      } else {
        document.getElementById("currentAccount").innerText = "Guest User";
        document.getElementById("loginHeaderBtn").style.display = "block";
        document.getElementById("logoutBtn").style.display = "none";
      }
    });

    // Email/Password Login & Auto Signup
    window.loginWithEmail = async function() {
      const email = document.getElementById("authEmail").value;
      const pass = document.getElementById("authPassword").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        closeAuthModal();
      } catch (err) {
        if (err.code === "auth/user-not-found") {
          await createUserWithEmailAndPassword(auth, email, pass);
          closeAuthModal();
        } else {
          alert("Auth Error: " + err.message);
        }
      }
    };

    // Google/Gmail Popup Login
    window.loginWithGoogle = async function() {
      try {
        await signInWithPopup(auth, googleProvider);
        closeAuthModal();
      } catch (err) {
        alert("Google Auth Error: " + err.message);
      }
    };

    // Logout
    window.logoutUser = function() {
      signOut(auth);
    };

    // UI Toggle Handlers
    window.toggleAccountMenu = function() {
      document.getElementById('accSwitcher').classList.toggle('active');
    };
    window.openAuthModal = function() {
      document.getElementById('authModal').classList.add('active');
    };
    window.closeAuthModal = function() {
      document.getElementById('authModal').classList.remove('active');
    };

    // Chat function
    window.sendMessage = async function() {
      const input = document.getElementById("userInput");
      const chatBox = document.getElementById("chatBox");
      const text = input.value.trim();

      if (!text) return;

      chatBox.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      const botMsgId = "bot-" + Date.now();
      chatBox.innerHTML += `<div class="msg bot" id="${botMsgId}">Thinking...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        document.getElementById(botMsgId).innerText = data.reply || data.error || "No response received.";
      } catch (err) {
        document.getElementById(botMsgId).innerText = "Error connecting to AI backend.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    };
  </script>
</body>
</html>
